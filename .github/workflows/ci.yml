# PR / merge gate aligned with docs/VERIFICATION.md.
# Standalone checkout — UF deps resolve via git branch = main on unified-field-dev.
# tag-app hydrate stays local; the tag-ui-e2e Playwright suite runs in the e2e job.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_TARGET_DIR: target-tag
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: 1
  # Leptos workspace deps enable the `nightly` feature.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          # Pin: floating tip breaks diskann-wide (surrealdb-core) with E0283.
          toolchain: nightly-2026-08-07
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt -p tag -p protected-tag-host -- --check

  clippy:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly-2026-08-07
          components: clippy
      # VERIFICATION.md preferred path: --all-targets on tag (not tag-app).
      - name: cargo clippy (tag all-targets + ssr)
        run: cargo clippy -p tag --all-targets --features ssr -- -D warnings
      - name: cargo clippy (protected-tag-host)
        run: cargo clippy -p protected-tag-host --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly-2026-08-07
      - name: cargo test (workspace + product_surface needles)
        run: cargo test -p tag --test workspace_members --test product_surface
      - name: cargo test (tag domain contracts)
        run: >
          cargo test -p tag --features ssr
          --test tag_crud_contract
          --test tag_service_integration
          --test privacy_policy_integration
          --test tag_unique_name
      - name: cargo check + run (protected-tag-host)
        run: |
          cargo check -p protected-tag-host
          cargo run -p protected-tag-host

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly-2026-08-07
      - name: cargo doc (tag, deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken-intra-doc-links"
        run: cargo doc -p tag --features ssr --no-deps

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly-2026-08-07
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/tag-ui-e2e/end2end/package-lock.json
      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked
      - name: Install npm deps and Chromium
        working-directory: examples/tag-ui-e2e/end2end
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # run-lanes.sh builds the lab host, then exits non-zero on a failed
      # build, a failed, missing or duplicated test, or a server that never
      # became ready (cargo leptos end-to-end exits 0 on those).
      - name: Playwright (4 lanes)
        working-directory: examples/tag-ui-e2e/end2end
        env:
          LANES: "4"
        run: ./run-lanes.sh
      - name: Upload lane output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-lanes-out
          path: examples/tag-ui-e2e/end2end/lanes-out
          if-no-files-found: ignore
