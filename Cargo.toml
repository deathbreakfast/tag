[workspace]
resolver = "2"
members = [
    "tag",
    "tag-app",
    "examples/protected-tag-host",
    "examples/tag-ui-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sean O'Rourke"]
repository = "https://github.com/unified-field-dev/tag"
homepage = "https://github.com/unified-field-dev/tag"
documentation = "https://github.com/unified-field-dev/tag"

[workspace.lints.rust]
missing_docs = "deny"
unexpected_cfgs = "allow"
# leptos-lints (Dylint) names are unknown to rustc/clippy alone
unknown_lints = "allow"
leptos_print_stdout = "deny"
leptos_event_target = "deny"
leptos_event_target_value = "deny"
leptos_unscoped_spawn = "deny"

[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/leptos-rs/leptos-lints", tag = "v0.1.2" }]

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

# Hydrate WASM for cargo-leptos (debuginfo on this graph overflows rust-lld .debug_str).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
debug = false

[workspace.dependencies]
# Leptos
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_config = { version = "0.8", default-features = false }
leptos_dom = { version = "0.8", default-features = false }
leptos_integration_utils = { version = "0.8", default-features = false }
leptos_macro = { version = "0.8", default-features = false }
leptos_server = { version = "0.8", default-features = false }
leptos-use = { version = "0.18", default-features = false }
codee = { version = "0.3", default-features = false }
# Zone A Orbital UI
orbital-zone-a = { package = "orbital-ui", git = "https://github.com/unified-field-dev/orbital", branch = "main", default-features = false }
orbital-macros = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-shell = { git = "https://github.com/unified-field-dev/orbital", branch = "main", default-features = false }
orbital-theme = { git = "https://github.com/unified-field-dev/orbital", branch = "main", default-features = false }
orbital-base-components = { git = "https://github.com/unified-field-dev/orbital", branch = "main", default-features = false }

# Platform — uf-dev git main (mem only at workspace level so hydrate/wasm does not pull sqlx/mio)
valence = { package = "uf-valence", git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency", default-features = false, features = ["mem"] }
valence-codegen = { package = "uf-valence-codegen", git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
valence-macros = { package = "uf-valence-macros", git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
valence-telemetry = { package = "uf-valence-telemetry", git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
higgs = { git = "https://github.com/unified-field-dev/higgs", branch = "main", default-features = false }
higgs-host = { git = "https://github.com/unified-field-dev/higgs", branch = "main", default-features = false }
higgs-identity = { git = "https://github.com/unified-field-dev/higgs", branch = "main" }
lepton-host-adapter = { git = "https://github.com/unified-field-dev/lepton", branch = "main", default-features = false }
lepton = { git = "https://github.com/unified-field-dev/lepton", branch = "main", default-features = false }
lepton-identity = { git = "https://github.com/unified-field-dev/lepton", branch = "main", default-features = false }
quark = { package = "uf-quark", git = "https://github.com/unified-field-dev/quark", branch = "main" }

# Unified Field product
uf-product = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main", default-features = false }
uf-product-macros = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main" }
uf-help-macros = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main" }
uf-help = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main", default-features = false }
uf-search-core = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main", default-features = false }
uf-integrations = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main", default-features = false }
uf-notifications-core = { git = "https://github.com/unified-field-dev/uf-notifications", branch = "main" }
lepton-shell = { git = "https://github.com/unified-field-dev/lepton-uf-app", branch = "main", default-features = false }

# Record history
record-history = { git = "https://github.com/unified-field-dev/record-history", branch = "main", default-features = false }
record-history-leptos = { git = "https://github.com/unified-field-dev/record-history", branch = "main", default-features = false }

# Spectra
spectra = { package = "uf-spectra", git = "https://github.com/unified-field-dev/Spectra", branch = "main", default-features = false }
spectra-core = { package = "uf-spectra-core", git = "https://github.com/unified-field-dev/Spectra", branch = "main" }
spectra-macros = { git = "https://github.com/unified-field-dev/Spectra", branch = "main" }
spectra-codegen = { package = "spectra-codegen", git = "https://github.com/unified-field-dev/Spectra", branch = "main" }

# Photon / photon-leptos
photon = { package = "uf-photon", git = "https://github.com/unified-field-dev/photon", branch = "main", default-features = false }
photon-macros = { git = "https://github.com/unified-field-dev/photon", branch = "main" }
photon-runtime = { git = "https://github.com/unified-field-dev/photon", branch = "main", default-features = false }
photon-backend = { git = "https://github.com/unified-field-dev/photon", branch = "main", default-features = false }
photon-leptos = { git = "https://github.com/unified-field-dev/photon-leptos", branch = "main", default-features = false }
photon-leptos-macros = { git = "https://github.com/unified-field-dev/photon-leptos", branch = "main" }
orbital-paging = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
axum = { version = "0.8.4", default-features = false, features = ["ws"] }
axum-login = "0.18.0"
tower-sessions = "0.14.0"

# In-repo product crates
tag = { path = "tag", default-features = false }

url = "2"
dashmap = "5"
wasm-bindgen = "=0.2.126"
web-sys = { version = "=0.3.103", features = ["Element", "HtmlElement", "Node", "Document"] }
icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
turf = "0.10"

# Server / data
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
log = "0.4.27"
thiserror = "2.0.12"
http = "1.3.1"
cfg-if = "1.0.0"
tracing = "0.1"
surrealdb = { version = "3.1", default-features = false, features = ["kv-mem"] }
tokio = { version = "1.45.0", features = ["rt-multi-thread", "macros"] }
inventory = "0.3"
futures = "0.3"
quick_cache = "0.6"
regex = "1.10"
aes-gcm = "0.10"
base64 = "0.22"
argon2 = "0.5"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["std"] }

[[workspace.metadata.leptos]]
name = "tag-ui-e2e"
output-name = "tag-ui-e2e"
bin-package = "tag-ui-e2e"
lib-package = "tag-ui-e2e"
site-root = "examples/tag-ui-e2e/site"
site-pkg-dir = "pkg"
style-file = "examples/tag-ui-e2e/style/main.scss"
assets-dir = "examples/tag-ui-e2e/public"
end2end-dir = "examples/tag-ui-e2e/end2end"
end2end-cmd = "npm test"
# Clear of product hosts (:3000–:3001), lepton kit (:3120), lepton-uf-app (:3140), gauge (:3150).
site-addr = "127.0.0.1:3160"
reload-port = 3161
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
disable-erase-components = true
lib-profile-dev = "wasm-release"
lib-profile-release = "wasm-release"

# Kits that still declare Valence/Photon/Orbital via crates.io — unify onto uf-dev git.
[patch.crates-io]
uf-valence = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-valence-codegen = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-valence-core = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-valence-macros = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-valence-telemetry = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-valence-schema-dsl = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-valence-backend-mem = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-valence-backend-sqlite = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-valence-backend-sql = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-valence-backend-postgres = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-valence-backend-hybrid = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-valence-backend-indradb = { git = "https://github.com/deathbreakfast/valence", branch = "feat/data-use-transparency" }
uf-photon = { git = "https://github.com/unified-field-dev/photon", branch = "main" }
uf-photon-core = { git = "https://github.com/unified-field-dev/photon", branch = "main" }
photon-runtime = { git = "https://github.com/unified-field-dev/photon", branch = "main" }
photon-backend = { git = "https://github.com/unified-field-dev/photon", branch = "main" }
photon-telemetry = { git = "https://github.com/unified-field-dev/photon", branch = "main" }
photon-macros = { git = "https://github.com/unified-field-dev/photon", branch = "main" }
uf-quark = { git = "https://github.com/unified-field-dev/quark", branch = "main" }
orbital-paging = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-data = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-ui = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-macros = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-shell = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-core-components = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-base-components = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-primitives = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-theme = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-datatable = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-date-pickers = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-charts = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-tree = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-scheduler = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-motion = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-history = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
